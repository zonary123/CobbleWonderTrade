name: Build, Discord & Modrinth Release

on:
  push:
    tags:
      - '*'

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JAVA_VERSION: 21
  JAVA_DISTRIBUTION: temurin

jobs:
  full-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set project info
        id: set-info
        run: |
          TAG="${{ github.ref_name }}"
          MOD_NAME=$(grep '^mod_name=' gradle.properties | cut -d'=' -f2 | tr -d '\r ')
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r ')
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "MOD_NAME=$MOD_NAME" >> $GITHUB_ENV
          echo "MOD_VERSION=$MOD_VERSION" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - run: chmod +x ./gradlew

      - name: Build mod
        run: |
          ./gradlew build --no-daemon

      - name: Create GitHub Release
        run: |
          JARS=$(ls fabric/build/libs/*.jar neoforge/build/libs/*.jar 2>/dev/null | grep -v "sources" | grep -v "dev-shadow" | grep -v "\-dev\.jar" || true)
          echo "Jars a subir: $JARS"
          gh release create "$TAG" $JARS \
            --title "Release $TAG" \
            --notes "Automated release for version $TAG"

      - name: Send Discord Notification with Embed and File
        run: |
          FILE=$(ls fabric/build/libs/*.jar 2>/dev/null | grep -v "sources" | grep -v "dev-shadow" | grep -v "\-dev\.jar" | head -n1 || true)
          
          # Extraer changelog
          BASE=$(echo "$TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "$MOD_VERSION")
          CHANGELOG_CONTENT=""
          if [ -f "CHANGELOG.md" ]; then
            CHANGELOG_CONTENT=$(tr -d '\r' < CHANGELOG.md | awk -v ver="$BASE" '
              $0 ~ "## \\[" ver "\\]" {flag=1; next}
              /^## \[/ && flag {flag=0}
              flag {print}
            ')
          fi
          
          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT="Release $TAG for Cobblemon 1.8.0 / Minecraft 1.21.1"
          fi
          
          # Generar JSON embed
          JSON_PAYLOAD=$(jq -nc --arg tag "$TAG" --arg changelog "$CHANGELOG_CONTENT" \
            '{content: "@everyone 🎉 New Release!", embeds:[{title:("Release "+$tag), description:$changelog, color:3066993}]}')
          
          echo "Embed JSON: $JSON_PAYLOAD"
          
          # 1️⃣ Enviar embed
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD"
            
            # 2️⃣ Enviar archivo
            if [ -n "$FILE" ] && [ -f "$FILE" ]; then
              curl -s -X POST "$DISCORD_WEBHOOK_URL" \
                -F "file=@${FILE}"
            fi
          fi
