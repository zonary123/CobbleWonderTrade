plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.9-SNAPSHOT" apply false
    id "com.gradleup.shadow" version "8.3.5" apply false
    id "maven-publish"
}

ext.hash_id = ""

def isDev = project.hasProperty("isDev") ? project.property("isDev").toBoolean() : false

if (isDev) {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        ext.hash_id = stdout.toString().trim()
    } catch (Exception e) {
        ext.hash_id = "dev"
    }
}

if (System.getenv("GITHUB_ACTIONS") == "true") {
    if (System.getenv("GITHUB_WORKFLOW") == "Build, Discord & Modrinth Release") {
        version = rootProject.mod_version
    } else if (System.getenv("PULL_REQUEST")) {
        version = "${rootProject.mod_version}-pr.${System.getenv("PULL_REQUEST")}.${System.getenv("GITHUB_RUN_NUMBER")}"
    } else {
        version = "${rootProject.mod_version}-${System.getenv("GITHUB_RUN_NUMBER")}"
    }
} else {
    version = rootProject.mod_version + (isDev ? "-dev-${hash_id}" : "")
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    version = "${rootProject.version}"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"

        compileOnly "org.projectlombok:lombok:${rootProject.lombok_version}"
        annotationProcessor "org.projectlombok:lombok:${rootProject.lombok_version}"
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = "${rootProject.archives_base_name}-${rootProject.minecraft_version}-${project.name}"
    group = rootProject.maven_group

    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://jitpack.io" }
        maven { url "https://cursemaven.com" }
        maven { url "https://www.cursemaven.com" }
        maven { url "https://api.modrinth.com/maven" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://repo.maven.apache.org/maven2/" }
        maven { url "https://repo.spongepowered.org/maven/" }
        maven { url "https://repo.essentialsx.net/releases/" }
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        maven { url "https://thedarkcolour.github.io/KotlinForForge/" }
        maven { url "https://papermc.io/repository/maven-public/" }
        maven { url "https://maven.impactdev.net/repository/development/" }
        maven { url "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
        maven { url "https://repo.extendedclip.com/content/repositories/placeholderapi/" }
        maven {
            url "https://maven.nucleoid.xyz/"
            name = "Nucleoid"
        }
        maven {
            url "https://oss.sonatype.org/content/repositories/snapshots"
            name = "Sonatype Snapshots"
        }
        maven {
            url "https://s01.oss.sonatype.org/content/repositories/snapshots"
            name = "Sonatype 01 Snapshots"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 21
        options.compilerArgs += [
                "-g",
                "-O",
                "-parameters"
        ]
    }

    java {
        withSourcesJar()
    }
}
